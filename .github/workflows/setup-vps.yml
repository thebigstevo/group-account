name: Setup VPS (One-time)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure VPS (Nginx + initial setup)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Create app directory
            mkdir -p /opt/treasurio/deploy

            # Nginx config for dev
            cat > /etc/nginx/sites-available/treasurio-dev << 'NGINX'
            server {
                listen 80;
                server_name dev-groupledger.tilcsaas.com;

                location / {
                    proxy_pass http://127.0.0.1:3100;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                    client_max_body_size 5M;
                }
            }
            NGINX

            # Nginx config for prod
            cat > /etc/nginx/sites-available/treasurio-prod << 'NGINX'
            server {
                listen 80;
                server_name prod-groupledger.tilcsaas.com;

                location / {
                    proxy_pass http://127.0.0.1:3200;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                    client_max_body_size 5M;
                }
            }
            NGINX

            # Enable sites
            ln -sf /etc/nginx/sites-available/treasurio-dev /etc/nginx/sites-enabled/treasurio-dev
            ln -sf /etc/nginx/sites-available/treasurio-prod /etc/nginx/sites-enabled/treasurio-prod

            # Test and reload
            nginx -t && systemctl reload nginx
            echo "✓ Nginx configured"

            # Install certbot if not present and get certs
            if command -v certbot &> /dev/null; then
              certbot --nginx --non-interactive --agree-tos --email admin@tilcsaas.com \
                -d dev-groupledger.tilcsaas.com \
                -d prod-groupledger.tilcsaas.com || echo "Certbot failed — DNS might not be pointed yet"
            else
              echo "Certbot not installed. Run: apt install certbot python3-certbot-nginx"
            fi

            echo "✓ VPS setup complete"
