name: Deploy Prod

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS (Prod)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,DEV_SESSION_SECRET,DEV_N8N_API_TOKEN,DEV_GROUP_NAME,PROD_SESSION_SECRET,PROD_N8N_API_TOKEN,PROD_GROUP_NAME
          script: |
            set -e
            APP_DIR="/opt/treasurio"
            BRANCH="${{ github.ref_name }}"
            if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            else
            rm -rf "$APP_DIR"
            git clone -b "$BRANCH" https://github.com/thebigstevo/group-account.git "$APP_DIR"
            fi
            cd "$APP_DIR/deploy"
            printf 'POSTGRES_PASSWORD=%s\nDEV_SESSION_SECRET=%s\nDEV_N8N_API_TOKEN=%s\nDEV_GROUP_NAME=%s\nPROD_SESSION_SECRET=%s\nPROD_N8N_API_TOKEN=%s\nPROD_GROUP_NAME=%s\nGROUP_CURRENCY=GHS\n' "$POSTGRES_PASSWORD" "$DEV_SESSION_SECRET" "$DEV_N8N_API_TOKEN" "$DEV_GROUP_NAME" "$PROD_SESSION_SECRET" "$PROD_N8N_API_TOKEN" "$PROD_GROUP_NAME" > .env
            if [ ! -f /etc/nginx/sites-enabled/prod-groupledger.tilcsaas.com.conf ]; then
            printf 'server {\n    listen 80;\n    server_name prod-groupledger.tilcsaas.com;\n    client_max_body_size 5M;\n    location / {\n        proxy_pass http://127.0.0.1:3200;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection "upgrade";\n        proxy_connect_timeout 300s;\n        proxy_send_timeout 300s;\n        proxy_read_timeout 300s;\n    }\n}\n' > /etc/nginx/sites-enabled/prod-groupledger.tilcsaas.com.conf
            nginx -t && systemctl reload nginx
            echo "Nginx config added for prod"
            fi
            docker compose --env-file .env up -d --build postgres app-prod
            sleep 12
            docker compose --env-file .env exec -T app-prod node src/migrate.js
            echo "Prod deployed successfully"
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEV_SESSION_SECRET: ${{ secrets.DEV_SESSION_SECRET }}
          DEV_N8N_API_TOKEN: ${{ secrets.DEV_N8N_API_TOKEN }}
          DEV_GROUP_NAME: ${{ secrets.DEV_GROUP_NAME }}
          PROD_SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          PROD_N8N_API_TOKEN: ${{ secrets.PROD_N8N_API_TOKEN }}
          PROD_GROUP_NAME: ${{ secrets.PROD_GROUP_NAME }}
