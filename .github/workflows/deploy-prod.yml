name: Deploy Prod

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS (Prod)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/opt/treasurio"
            REPO_URL="https://github.com/thebigstevo/group-account.git"
            BRANCH="${{ github.ref_name }}"

            # Clone or update repo
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git fetch origin
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            # Write .env for docker compose
            cat > "$APP_DIR/deploy/.env" <<EOF
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DEV_SESSION_SECRET=${{ secrets.DEV_SESSION_SECRET }}
            DEV_N8N_API_TOKEN=${{ secrets.DEV_N8N_API_TOKEN }}
            DEV_GROUP_NAME=${{ secrets.DEV_GROUP_NAME }}
            PROD_SESSION_SECRET=${{ secrets.PROD_SESSION_SECRET }}
            PROD_N8N_API_TOKEN=${{ secrets.PROD_N8N_API_TOKEN }}
            PROD_GROUP_NAME=${{ secrets.PROD_GROUP_NAME }}
            GROUP_CURRENCY=GHS
            EOF

            # Add nginx config if not present
            if [ ! -f /etc/nginx/sites-enabled/prod-groupledger.tilcsaas.com.conf ]; then
              cat > /etc/nginx/sites-enabled/prod-groupledger.tilcsaas.com.conf <<'NGINX'
            server {
                listen 80;
                server_name prod-groupledger.tilcsaas.com;
                client_max_body_size 5M;

                location / {
                    proxy_pass http://127.0.0.1:3200;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_connect_timeout 300s;
                    proxy_send_timeout 300s;
                    proxy_read_timeout 300s;
                }
            }
            NGINX
              nginx -t && systemctl reload nginx
              echo "  ✓ Nginx config added for prod-groupledger.tilcsaas.com"
            fi

            # Build and start prod container + shared postgres
            cd "$APP_DIR/deploy"
            docker compose --env-file .env up -d --build postgres app-prod

            # Wait for postgres healthy
            sleep 10

            # Run migrations on prod database
            docker compose --env-file .env exec -T app-prod node src/migrate.js

            echo "✓ Prod deployed: prod-groupledger.tilcsaas.com → :3200"
